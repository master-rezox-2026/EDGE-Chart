 const t=u.map((v,j)=>v+d[j]);let m=0;t.forEach((v,j)=>{if(v>t[m])m=j});const tot=t.reduce((s,v)=>s+v,0);let l=m,h=m,s=t[m];

function lowerBound(a,t){let l=0,h=a.length;while(l<h){const m=(l+h)>>1;if(a[m].t<t)l=m+1;else h=m}return l}
async function kl(s,iv,n,end){const r=await fetch('https://fapi.binance.com/fapi/v1/klines?symbol='+s+'&interval='+iv+'&limit='+n+(end?'&endTime='+end:''));if(!r.ok)throw new Error(r.status);const j=await r.json();return j.map(k=>({t:k[0]/1000,o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5],bv:+k[9]}))}
async function realBars(s,tf){let a=await kl(s,BI[tf],1500);try{a=(await kl(s,BI[tf],1500,a[0].t*1000-1)).concat(a)}catch(e){}return tf=='7h'?agg(a,25200):a}
async function loadPerps(first){try{const T=await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr').then(r=>r.json());let info=null;
 if(first||!perps.length){const ei=await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo').then(r=>r.json());info={};ei.symbols.filter(s=>s.contractType=='PERPETUAL'&&s.status=='TRADING').forEach(s=>info[s.symbol]=s)}
 const fresh=[];T.forEach(t=>{if(info&&!info[t.symbol])return;if(!info&&!TK[t.symbol])return;TK[t.symbol]={p:+t.lastPrice,pc:+t.priceChangePercent,qv:+t.quoteVolume,hi:+t.highPrice,lo:+t.lowPrice};PX[t.symbol]=+t.lastPrice;
  if(info){if(!META[t.symbol])META[t.symbol]=[info[t.symbol].baseAsset+' / '+info[t.symbol].quoteAsset+' PERPETUAL CONTRACT','Crypto','Binance'];fresh.push(t.symbol)}});
 if(info){perps=fresh;charts.forEach(c=>{if(TK[c.sym]&&!c.live)c.load()})}}catch(e){if(!warned++)toast('Binance unreachable: using simulated data. Open the downloaded file in your browser for live data.')}}
function qt(s){const T=TK[s],c=charts.find(c=>c.sym==s);if(T&&!(c&&!c.live)){const p=c&&c.live?c.bars[c.bars.length-1].c:T.p,P=T.p/(1+T.pc/100);return{p,ch:p-P,pc:(p/P-1)*100,v:T.qv,avg:T.qv}}return qt0(s)}
function rpDraw(){const r=$('#rp');r.hidden=!st.rp;if(!st.rp||!act)return;
 if(!$('#rl')){r.innerHTML=`<div class="rh"><span><button id="rt_wl">Watchlist</button><button id="rt_pp">Binance perps</button></span><span><button id="rp_add" title="Add symbol">＋</button><button id="rp_sc" title="Screener">▦</button></span></div><input id="rq" placeholder="Search" style="margin:0 10px 6px"><div class="rt"><span>Symbol</span><span>Last</span><span>Chg</span><span>Chg%</span></div><div class="rl" id="rl"></div><div class="rc2" id="rd"></div>`;$('#rq').oninput=rpDraw}
 const A=act.sym,pp=st.rpt=='pp',fq=$('#rq').value.trim().toUpperCase();$('#rt_wl').classList.toggle('on',!pp);$('#rt_pp').classList.toggle('on',pp);
 let L=pp?perps.slice().sort((a,b)=>TK[b].qv-TK[a].qv):st.wl;if(fq)L=L.filter(s=>s.includes(fq));
 $('#rl').innerHTML=(pp&&!perps.length?'<p class="nt" style="padding:10px">Binance data not loaded (offline or blocked). Open the downloaded file in your browser.</p>':'')
  +L.slice(0,300).map(s=>{const z=qt(s),k=z.ch>=0?'up':'dn',g=z.ch>=0?'+':'';return`<div class="rr ${s==A?'on':''}" data-s="${s}"><span><i class="ic">${s[0]}</i>${disp(s)}</span><span>${fp(z.p)}</span><span class="${k}">${g}${fp(Math.abs(z.ch))}</span><span class="${k}">${g}${z.pc.toFixed(2)}%</span></div>`}).join('');
 const M=META[A]||['','',''],q=qt(A),c=q.ch>=0?'up':'dn',sg=q.ch>=0?'+':'';
 $('#rd').innerHTML=`<div style="display:flex;align-items:center"><i class="ic">${A[0]}</i><b>${disp(A)}</b></div><div style="color:var(--mu);margin:6px 0">${M[0]}<br>${M[2]} · ${M[1]}${act.live?' · live':' · simulated'}</div><div class="big">${fp(q.p)} <small>USD</small></div><div class="${c}">${sg}${fp(Math.abs(q.ch))} ${sg}${q.pc.toFixed(2)}%</div><div class="up">● Market open</div><div class="rw" style="color:var(--mu);margin-top:8px"><span>Volume</span><span>Avg. volume (30D)</span></div><div class="rw"><b>${fv(q.v)}</b><b>${fv(q.avg)}</b></div>`}
function screener(){let sk='vol',sd=-1;const real=perps.length>0,RT={4:'Strong buy',2:'Buy',0:'Neutral','-2':'Sell','-4':'Strong sell'};
 const rows=real?perps.map(s=>{const t=TK[s],pos=(t.p-t.lo)/((t.hi-t.lo)||1);return{s,p:t.p,ch:t.pc,vol:t.qv,vc:NaN,sc:t.pc>3&&pos>.7?4:t.pc>0&&pos>.5?2:t.pc<-3&&pos<.3?-4:t.pc<0&&pos<.5?-2:0}})
 :Object.keys(META).filter(s=>META[s][1]=='Crypto').map(s=>{const b=data(s),q=qt(s),m=k=>b.slice(-k).reduce((a,x)=>a+x.c,0)/k,w=b.slice(-1440).reduce((a,x)=>a+x.v,0),w0=b.slice(-2880,-1440).reduce((a,x)=>a+x.v,0);return{s,p:q.p,ch:q.pc,vol:w*q.p,vc:(w/w0-1)*100,sc:(q.p>m(20)?1:-1)+(m(20)>m(50)?1:-1)+(q.p>m(200)?1:-1)+(q.pc>0?1:-1)}});
 const b=modal('',960),R=()=>{rows.sort((a,c)=>((c[sk]||0)-(a[sk]||0))*-sd);
  b.innerHTML=`<div class="sh2"><b>Screener · Binance perpetual (${rows.length})${real?'':' · simulated'}</b><button id="x_c">✕</button></div><div class="sl"><table class="tb2"><tr><th>Symbol</th><th>Exchange</th><th data-o="p">Price</th><th data-o="ch">Chg % 24h</th><th data-o="vol">Vol in USD ${sk=='vol'?(sd<0?'↓':'↑'):''}</th><th data-o="vc">Vol chg %</th><th data-o="sc">${real?'Momentum (24h)':'Tech rating'}</th></tr>`
  +rows.slice(0,700).map(r=>`<tr data-s="${r.s}"><td><i class="ic">${r.s[0]}</i>${disp(r.s)}</td><td>Binance</td><td>${fp(r.p)}</td><td class="${r.ch>=0?'up':'dn'}">${r.ch.toFixed(2)}%</td><td>${fv(r.vol)}</td><td class="${r.vc>=0?'up':'dn'}">${isNaN(r.vc)?'–':r.vc.toFixed(2)+'%'}</td><td class="${r.sc>0?'up':r.sc<0?'dn':''}">${RT[r.sc]}</td></tr>`).join('')+`</table></div>`};R();
 b.onclick=e=>{const o=e.target.dataset.o,r=e.target.closest('tr[data-s]');if(e.target.id=='x_c')closeM();else if(o){sd=sk==o?-sd:-1;sk=o;R()}else if(r){setSym(r.dataset.s);closeM()}}}
build();tbDraw();pps();loadPerps(1);setInterval(()=>loadPerps(0),15000);setInterval(()=>{charts.forEach(c=>c.tick());rd()},1000);
</script></body></html>
